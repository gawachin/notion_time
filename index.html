<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ocean Clock for Notion</title>
  <style>
    /* 全体の設定（背景画像とフォント） */
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      
      /* 背景画像の設定をocean.jpgに変更 */
      background-image: url('ocean.jpg');
      background-size: cover;       
      background-position: center;  
      background-repeat: no-repeat; 
      
      overflow: hidden;
      font-family: serif;
    }

    /* 時計パネル（すりガラス風） - 全体的に約0.7倍へ縮小 */
    .clock-container {
      background: rgba(255, 255, 255, 0.15); 
      backdrop-filter: blur(12px);           
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 17px; /* 24pxから縮小 */
      padding: 28px 42px;  /* 40px 60pxから縮小 */
      text-align: center;
      color: white; 
      box-shadow: 0 6px 22px 0 rgba(0, 0, 0, 0.2); /* 影も少し小さく調整 */
    }

    #time {
      font-size: 3.15rem; /* 4.5remから縮小 */
      font-weight: normal; 
      letter-spacing: 3px; /* 4pxから縮小 */
      margin: 0;
      text-shadow: 0 2px 5px rgba(0,0,0,0.6); 
    }

    #date {
      font-size: 0.85rem; /* 1.2remから縮小 */
      margin-top: 7px;    /* 10pxから縮小 */
      letter-spacing: 1.5px; /* 2pxから縮小 */
      opacity: 0.9;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>

  <!-- 時計部分 -->
  <div class="clock-container">
    <div id="date"></div>
    <div id="time"></div>
  </div>

  <!-- 時計を動かすJavaScript -->
  <script>
    function updateClock() {
      const now = new Date();
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const dayOfWeek = days[now.getDay()];

      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      // 日付と時間の表示を更新
      document.getElementById('date').innerText = `${year}.${month}.${day} (${dayOfWeek})`;
      document.getElementById('time').innerText = `${hours}:${minutes}:${seconds}`;
    }

    // 1秒ごとに更新
    setInterval(updateClock, 1000);
    updateClock(); // 読み込み時の初期表示
  </script>

</body>
</html>
