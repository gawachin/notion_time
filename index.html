<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ocean Clock for Notion</title>
  <style>
    /* 全体の設定（背景画像とフォント） */
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      
      /* 背景画像の設定 */
      background-image: url('ocean.jpg');
      background-size: cover;       /* 画面全体に画像を広げる */
      background-position: center;  /* 画像の中央を表示 */
      background-repeat: no-repeat; /* 画像の繰り返しを防ぐ */
      
      overflow: hidden;
      
      /* フォントを明朝体（serif）に設定 */
      font-family: serif;
    }

    /* 時計パネル（すりガラス風） */
    .clock-container {
      background: rgba(255, 255, 255, 0.15); /* 背景を少しだけ透過 */
      backdrop-filter: blur(12px);           /* すりガラス効果 */
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 24px;
      padding: 40px 60px;
      text-align: center;
      color: white; /* 文字色を白に設定 */
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
    }

    #time {
      font-size: 4.5rem;
      font-weight: normal; 
      letter-spacing: 4px;
      margin: 0;
      /* 画像と同化しないように文字に少し影をつける */
      text-shadow: 0 2px 5px rgba(0,0,0,0.6); 
    }

    #date {
      font-size: 1.2rem;
      margin-top: 10px;
      letter-spacing: 2px;
      opacity: 0.9;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>

  <!-- 時計部分 -->
  <div class="clock-container">
    <div id="date"></div>
    <div id="time"></div>
  </div>

  <!-- 時計を動かすJavaScript -->
  <script>
    function updateClock() {
      const now = new Date();
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const dayOfWeek = days[now.getDay()];

      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      // 日付と時間の表示を更新
      document.getElementById('date').innerText = `${year}.${month}.${day} (${dayOfWeek})`;
      document.getElementById('time').innerText = `${hours}:${minutes}:${seconds}`;
    }

    // 1秒ごとに更新
    setInterval(updateClock, 1000);
    updateClock(); // 読み込み時の初期表示
  </script>

</body>
</html>
