<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ocean Weather for Notion</title>
  <style>
    /* 全体の設定 */
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      
      /* 背景画像の設定（時計と同じ） */
      background-image: url('ocean.jpg');
      background-size: cover;       
      background-position: center;  
      background-repeat: no-repeat; 
      
      overflow: hidden;
      font-family: serif;
    }

    /* 天気パネル（すりガラス風・時計とサイズ感を統一） */
    .weather-container {
      background: rgba(255, 255, 255, 0.15); 
      backdrop-filter: blur(12px);           
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 24px;   /* 時計と同じ丸み */
      padding: 40px 60px;    /* 時計と同じ余白 */
      text-align: center;
      color: white; 
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
      
      /* 時計の幅（約450〜500px）に近くなるよう調整 */
      width: 380px; 
    }

    /* 冒頭のヘッダー部分 */
    .header {
      margin-bottom: 25px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
      padding-bottom: 15px;
    }

    .title {
      font-size: 1.8rem;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-shadow: 0 2px 5px rgba(0,0,0,0.6);
    }

    .subtitle {
      font-size: 1rem;
      letter-spacing: 1.5px;
      opacity: 0.9;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }

    /* 3列×3行のグリッド */
    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 15px; /* アイテム間の隙間 */
    }

    .forecast-item {
      background: rgba(255, 255, 255, 0.1); /* 個別の枠を少し透過させる */
      border-radius: 12px;
      padding: 12px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }

    /* グリッド内のテキストサイズ */
    .time { font-size: 0.9rem; margin-bottom: 6px; opacity: 0.9; letter-spacing: 1px; }
    .icon { font-size: 1.8rem; line-height: 1; margin-bottom: 6px; }
    .temp { font-size: 1.1rem; font-weight: normal; margin-bottom: 3px; }
    .rain { font-size: 0.8rem; opacity: 0.85; }
  </style>
</head>
<body>

  <div class="weather-container">
    <!-- ヘッダー部分 -->
    <div class="header">
      <div class="title">Today's Forecast</div>
      <div class="subtitle"><span id="date-str"></span> | Hino, Tokyo</div>
    </div>
    
    <!-- 天気グリッド部分 -->
    <div class="forecast-grid" id="forecast">
      <div style="grid-column: 1 / -1; text-align: center;">読み込み中...</div>
    </div>
  </div>

  <script>
    // 日野市の緯度・経度
    const lat = 35.6785;
    const lon = 139.3940;

    // 0:00〜24:00(翌0:00)まで取得するため forecast_days=2 に設定
    const apiUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation,weathercode&timezone=Asia%2FTokyo&forecast_days=2`;

    const weatherCodes = {
      0: { icon: '☀️', text: '快晴' },
      1: { icon: '🌤', text: '晴れ' },
      2: { icon: '⛅', text: '一部曇' },
      3: { icon: '☁️', text: '曇り' },
      45: { icon: '🌫', text: '霧' },
      48: { icon: '🌫', text: '霧氷' },
      51: { icon: '🌧', text: '小雨' },
      53: { icon: '🌧', text: '小雨' },
      55: { icon: '🌧', text: '雨' },
      61: { icon: '☔', text: '雨' },
      63: { icon: '☔', text: '雨' },
      65: { icon: '☔', text: '大雨' },
      71: { icon: '❄️', text: '小雪' },
      73: { icon: '❄️', text: '雪' },
      75: { icon: '❄️', text: '大雪' },
      80: { icon: '🌦', text: '驟雨' },
      81: { icon: '🌦', text: '驟雨' },
      82: { icon: '🌦', text: '激しい雨' },
      95: { icon: '⛈', text: '雷雨' }
    };

    async function loadForecast() {
      try {
        const res = await fetch(apiUrl);
        const data = await res.json();
        const hourly = data.hourly;

        // 時計と同じ形式で日付を生成
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const dayOfWeek = days[now.getDay()];
        
        document.getElementById('date-str').innerText = `${year}.${month}.${day} (${dayOfWeek})`;

        const container = document.getElementById('forecast');
        container.innerHTML = '';

        // 取得する時間帯のインデックス（24 = 翌日の0:00）
        const timeIndices = [0, 3, 6, 9, 12, 15, 18, 21, 24];

        timeIndices.forEach(i => {
          // 24の場合は "24:00" と表示、それ以外は "03:00" のようにゼロ埋め
          const timeLabel = i === 24 ? "24:00" : `${String(i).padStart(2, '0')}:00`;
          const temp = Math.round(hourly.temperature_2m[i]);
          const rain = hourly.precipitation[i].toFixed(1);
          const code = hourly.weathercode[i];
          const info = weatherCodes[code] || { icon: '❓', text: '不明' };

          const item = document.createElement('div');
          item.className = 'forecast-item';
          item.innerHTML = `
            <div class="time">${timeLabel}</div>
            <div class="icon" title="${info.text}">${info.icon}</div>
            <div class="temp">${temp}°C</div>
            <div class="rain">💧${rain}mm</div>
          `;
          container.appendChild(item);
        });
      } catch (err) {
        document.getElementById('forecast').innerHTML = '<div style="grid-column: 1 / -1; text-align: center;">取得に失敗しました</div>';
      }
    }

    loadForecast();
    // 30分ごとに天気を自動更新
    setInterval(loadForecast, 30 * 60 * 1000);
  </script>

</body>
</html>
